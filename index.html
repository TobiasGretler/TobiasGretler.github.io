<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Negensicht — Photography, room by room</title>
  <meta name="description" content="Step inside a 3D photography gallery and explore a collection of images.">

  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cardo:wght@400;700&display=swap" rel="stylesheet">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/styleRoom.css" rel="stylesheet">
</head>

<body class="room-home">
  <main id="main" class="room-page">
    <div class="room-heading">
      <div>
        <p class="room-kicker">A photography collection</p>
        <h1>Step inside.<br>Stay a while.</h1>
      </div>
      <div class="room-intro">
        <p class="room-current-title" data-room-title aria-live="polite">Into the wild</p>
        <a class="room-gallery-link" href="gallery.html">Browse the gallery <span aria-hidden="true">&rarr;</span></a>
      </div>
    </div>

    <section class="room-experience" aria-label="Interactive photography gallery">
      <div class="room-stage">
        <div class="room-scroller">
          <div class="room room--current room--forest" data-title="Into the wild" aria-hidden="false">
            <div class="room__side room__side--back">
              <img class="room__img" src="assets/img/gallery/gallery-13.jpg" alt="" fetchpriority="high">
              <img class="room__img" src="assets/img/gallery/gallery-8.jpg" alt="" fetchpriority="high">
            </div>
            <div class="room__side room__side--left">
              <img class="room__img" src="assets/img/gallery/gallery-10.jpg" alt="" fetchpriority="high">
            </div>
            <div class="room__side room__side--right">
              <img class="room__img" src="assets/img/gallery/gallery-14.jpg" alt="" fetchpriority="high">
            </div>
            <div class="room__side room__side--floor"></div>
          </div>

          <div class="room room--architecture" data-title="Lines and light" aria-hidden="true">
            <div class="room__side room__side--back">
              <img class="room__img" src="assets/img/Architecture/cathedral-1066314_1280.jpg" alt="" loading="lazy">
              <img class="room__img" src="assets/img/Architecture/house-1867187_1280.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--left">
              <img class="room__img" src="assets/img/Architecture/abstract-1138967_1280.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--right">
              <img class="room__img" src="assets/img/Architecture/architecture-2083687_1280.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--floor"></div>
          </div>

          <div class="room room--coast" data-title="Somewhere by the sea" aria-hidden="true">
            <div class="room__side room__side--back">
              <img class="room__img" src="assets/img/gallery/gallery-3.jpg" alt="" loading="lazy">
              <img class="room__img" src="assets/img/gallery/gallery-5.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--left">
              <img class="room__img" src="assets/img/gallery/gallery-7.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--right">
              <img class="room__img" src="assets/img/gallery/gallery-9.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--floor"></div>
          </div>

          <div class="room room--journey" data-title="The long way round" aria-hidden="true">
            <div class="room__side room__side--back">
              <img class="room__img" src="assets/img/gallery/gallery-2.jpg" alt="" loading="lazy">
              <img class="room__img" src="assets/img/gallery/gallery-11.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--left">
              <img class="room__img" src="assets/img/gallery/gallery-12.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--right">
              <img class="room__img" src="assets/img/gallery/gallery-4.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--floor"></div>
          </div>

          <div class="room room--color" data-title="A little more color" aria-hidden="true">
            <div class="room__side room__side--back">
              <img class="room__img" src="assets/img/gallery/gallery-1.jpg" alt="" loading="lazy">
              <img class="room__img" src="assets/img/gallery/gallery-15.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--left">
              <img class="room__img" src="assets/img/gallery/gallery-6.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--right">
              <img class="room__img" src="assets/img/gallery/gallery-16.jpg" alt="" loading="lazy">
            </div>
            <div class="room__side room__side--floor"></div>
          </div>
        </div>
      </div>

      <div class="room-overlay">
        <div class="room-controls" aria-label="Gallery navigation">
          <p class="room-counter" aria-live="polite">
            <span data-room-index>01</span><span class="room-counter-divider">/</span><span data-room-total>05</span>
          </p>
          <div class="room-buttons">
            <button class="room-nav room-nav--previous" type="button" aria-label="Previous room">
              <span aria-hidden="true">&larr;</span>
            </button>
            <button class="room-nav room-nav--next" type="button" aria-label="Next room">
              <span aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>
        <p class="room-hint" aria-hidden="true">Use the arrows to explore</p>
      </div>
    </section>
  </main>

  <footer id="footer" class="footer">
    <div class="container">
      <div class="copyright">
        &copy; Copyright <strong><span>PhotoAlbum</span></strong>. All Rights Reserved
      </div>
      <div class="credits">
        Designed by <a href="https://github.com/TobiasGretler">Tobias Gretler</a>
      </div>
    </div>
  </footer>

  <div id="preloader"><div class="line"></div></div>

  <script src="assets/js/header.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/room/room-navigation.js"></script>
</body>

</html>
